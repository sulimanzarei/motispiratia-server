# Satisfactory service, copied from sticky notes on toph on 2026-10-08.
# NOT deployed: it isn't in ~/servers/docker-compose.yml. The save data is in
# ~/servers/games/satisfactory. No secrets; otherwise exactly as written in the notes.
services:
  satisfactory-server:
    container_name: 'satisfactory-server'
    hostname: 'satisfactory-server'
    image: 'wolveix/satisfactory-server:latest'
    ports:
      - '7777:7777/tcp'
      - '7777:7777/udp'
      - '8888:8888/tcp'
    volumes:
      - '/home/sulimanza/servers/games/satisfactory:/config'
    environment:
      - MAXPLAYERS=4
      - PGID=1000
      - PUID=1000
      - STEAMBETA=false
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
