# Snapshot of ~/servers/docker-compose.yml on 2026-10-07 (CachyOS era). No secrets; identical to the live file.
services:
  minecraft-duke:
    image: itzg/minecraft-server:latest
    container_name: minecraft-duke
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.2"
      USE_AIKAR_FLAGS: "true"
      INIT_MEMORY: "10G"
      MEMORY: "10G"
    volumes:
      - /home/sulimanza/servers/games/minecraft-duke:/data
